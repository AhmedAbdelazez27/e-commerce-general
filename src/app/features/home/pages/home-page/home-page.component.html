<div class="home-page home-page--viewport">
  <app-home-hero [config]="config().hero" class="row" />

  <app-home-brands [config]="config().brands" />

  @if (config().curatedCollections; as curated) {
    <app-home-curated-collections [config]="curated" />
  }

  @if (newArrivalsSection(); as section) {
    <app-home-new-arrivals [section]="section" />
  }

  @if (bestSellersSection(); as section) {
    <app-home-best-sellers [section]="section" />
  }

  @for (section of otherProductSections(); track section.id) {
    <app-home-product-section [section]="section" [products]="productsForSection(section.id)" />
  }

  <app-home-category-shortcuts />

  <!-- Hidden per request — "عروض خاصة / وفّر أكثر على الباقات والعروض الموسمية"   -->
  <app-home-offers [offers]="config().offers" />

  <app-home-trust-badges [badges]="trustBadges()" />
</div>
